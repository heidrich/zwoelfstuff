name: Package and release

# Tag it, and CurseForge gets the build. Nothing is uploaded on an ordinary
# push - a release is a decision, not a side effect of committing.
#
#   git tag 4.29.0 && git push origin 4.29.0
#
# The repo does NOT need to be public for this: the action runs inside it.
on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    # The packager uploads to CurseForge AND creates a GitHub release. The
    # second half needs write access to the repository's contents, and the
    # default for GITHUB_TOKEN is read-only - which fails with a 403,
    # "Resource not accessible by integration", AFTER the CurseForge upload
    # has already succeeded. Half a release is the worst of the three
    # outcomes, so this line is not optional.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The packager reads the tag history to build the changelog, and a
          # shallow clone has none of it.
          fetch-depth: 0

      # Nothing is uploaded until /zs test can be run headlessly here as well;
      # for now the gate is the tag. The desktop harness needs a Lua runtime
      # that is not on this runner - see ../ZwoelfStuff-internal/HANDOFF.md,
      # "the harness", which is deliberately not in this repo.

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        env:
          # Settings, Secrets and variables, Actions:
          #   CF_API_KEY       from CurseForge, Account, API Tokens
          # GITHUB_TOKEN is provided by Actions itself.
          #
          # NO WAGO TOKEN, ON PURPOSE (2026-08-17). Wago pulls every release
          # from GitHub through its own integration - the owner: "wago zieht
          # den build selbst" - so the packager's upload was a second copy of
          # the same file, and its token had been rejected with a 401 on
          # every tag since 4.81.0, painting a run red whose CurseForge and
          # GitHub halves were green. A build that is always red is read by
          # nobody. Without the token the packager skips Wago and says so;
          # the `## X-Wago-ID:` line in the TOC is left for Wago's own use.
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      # THE RELEASE ANNOUNCES ITSELF, if a channel has been set up for it.
      #
      # A Discord WEBHOOK, not a bot: a bot is an account to host, to keep
      # alive and to give permissions to, for the sake of one message every
      # few days. A webhook is a URL that a channel hands out and that posts
      # into that one channel and nowhere else.
      #
      # TO TURN IT ON: in Discord, right-click the channel, Edit Channel,
      # Integrations, Webhooks, New Webhook, Copy Webhook URL. Then here:
      # Settings, Secrets and variables, Actions, New repository secret,
      # named DISCORD_WEBHOOK. Nothing is posted until that exists - the step
      # runs and says so - so this is inert for anybody who forks the repo.
      #
      # It runs AFTER the packager and never fails the job: the addon is
      # already on CurseForge by the time this speaks, and losing a release
      # over an announcement would be the tail wagging the dog.
      - name: Announce on Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 .github/scripts/discord_release.py \
            --tag "${GITHUB_REF_NAME}" \
            --link "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
